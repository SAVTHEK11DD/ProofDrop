<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="pdBg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181b20" />
      <stop offset="100%" stop-color="#0a2321" />
    </linearGradient>
    <linearGradient id="pdBorder" x1="0" y1="0" x2="32" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#087f7a" />
      <stop offset="100%" stop-color="#3dd6c6" />
    </linearGradient>
  </defs>
  <!-- Background badge -->
  <rect x="1" y="1" width="30" height="30" rx="7.5" fill="url(#pdBg)" stroke="url(#pdBorder)" stroke-width="1.4" />
  <!-- Brand mark PD -->
  <text x="16" y="21.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="14.5" fill="#f7f4ec" letter-spacing="-0.5">PD</text>
  <!-- Verification proof dot -->
  <circle cx="24.5" cy="7.5" r="2.2" fill="#087f7a" stroke="#d7fbf7" stroke-width="0.8" />
</svg>
